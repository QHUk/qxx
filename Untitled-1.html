<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>阙杨彬的体检报告</title>
    <style>
        /* 方法一：通过CSS让所有h1标题居中 */
        h1 {
            text-align: center;
            color: #333; /* 顺便设置个字体颜色 */
        }

        /* 方法二：让图片也居中显示（可选） */
        /* 因为img默认是行内元素，给它的父元素设置text-align: center即可 */
        .image-container {
            text-align: center;
        }

        /* 限制图片最大宽度，防止图片过大撑破页面（可选） */
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <!-- 标题部分 -->
    <h1>阙杨彬的体检报告</h1>

    <!-- 图片部分：放在标题下方 -->
    <div class="image-container">
        <!-- 请将 src 替换为你自己的图片路径 -->
        <img src="c:\Users\阙杨彬\Desktop\阙杨彬的体检结果\未标题-1.png" alt="这是一张示例占位图片">
    </div>

</body>
</html>
